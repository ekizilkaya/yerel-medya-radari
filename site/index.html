<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yerel Medya Radarı</title>
  <meta name="description" content="Türkiye'nin 81 ilindeki yerel haber sitelerinde seçili konuların günlük izlenmesi.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%232a78d6' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%232a78d6' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%232a78d6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    // Tema tercihi sayfa çizilmeden uygulanır (yanıp sönme olmasın)
    try { const t = localStorage.getItem('radar-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

  <header class="top">
    <div class="wrap">
      <a class="brand" href="#/">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="var(--series-1)" stroke-width="3"/><circle cx="16" cy="16" r="7" fill="none" stroke="var(--series-1)" stroke-width="3"/><circle cx="16" cy="16" r="2.5" fill="var(--series-1)"/></svg>
        <span id="siteTitle">Yerel Medya Radarı</span>
      </a>
      <nav id="nav" aria-label="Bölümler"></nav>
      <button class="icon-btn" id="themeBtn" type="button" title="Açık / koyu tema" aria-label="Açık / koyu tema">◐</button>
    </div>
  </header>

  <main><div class="wrap" id="view"><p class="muted">Yükleniyor…</p></div></main>

  <footer>
    <div class="wrap" id="footer"></div>
  </footer>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
